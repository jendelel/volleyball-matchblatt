/* ==========================================================================
   Swiss Volley / FIVB Official Matchblatt — Sheet & Viewport Styles
   100% Offline, Zero External Fonts or CDNs
   ========================================================================== */

.mb-sheet-host,
.sheet-container {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #e9eef5;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

svg.mb-sheet-svg {
  display: block;
  width: 100%;
  height: auto;
  max-width: 100%;
  max-height: 100%;
  background: #ffffff;
  box-shadow: 0 4px 20px rgba(15, 23, 42, 0.12), 0 1px 3px rgba(15, 23, 42, 0.08);
  border-radius: 2px;
  shape-rendering: geometricPrecision;
  text-rendering: geometricPrecision;
}

/* Interactive Manual Cell Override Mode */
svg.mb-sheet-svg.mb-interactive [data-cell-key] {
  cursor: pointer;
}

svg.mb-sheet-svg.mb-interactive .mb-cell-hit {
  fill: rgba(37, 99, 235, 0.01);
  stroke: transparent;
  stroke-width: 1;
  transition: fill 120ms ease, stroke 120ms ease;
}

svg.mb-sheet-svg.mb-interactive [data-cell-key]:hover .mb-cell-hit {
  fill: rgba(37, 99, 235, 0.12);
  stroke: #2563eb;
  stroke-width: 1.2;
}

svg.mb-sheet-svg.mb-interactive [data-cell-key].mb-overridden .mb-cell-hit {
  fill: rgba(124, 58, 237, 0.09);
  stroke: rgba(124, 58, 237, 0.45);
  stroke-dasharray: 2 1.5;
}

/* Latest Change Highlight Pulse */
@keyframes mbHighlightPulse {
  0%, 100% {
    fill-opacity: 0.34;
    stroke-opacity: 0.95;
  }
  50% {
    fill-opacity: 0.52;
    stroke-opacity: 1;
  }
}

svg.mb-sheet-svg .mb-highlight {
  fill: #fbbf24;
  fill-opacity: 0.36;
  stroke: #d97706;
  stroke-width: 1.8;
  pointer-events: none;
  animation: mbHighlightPulse 1.8s ease-in-out infinite;
}

@media (prefers-reduced-motion: reduce) {
  svg.mb-sheet-svg .mb-highlight {
    animation: none;
  }
}

@media print {
  .mb-sheet-host,
  .sheet-container {
    background: #ffffff;
  }

  svg.mb-sheet-svg {
    box-shadow: none;
    border-radius: 0;
    width: 100%;
    height: auto;
  }

  svg.mb-sheet-svg .mb-highlight {
    display: none !important;
  }
}

/* ==========================================================================
   Matchblatt — Athletic High-Contrast Responsive UI (Zero External Fonts/CDNs)
   Target viewports:
     - Phone Portrait (iPhone 17: 393x852 / 402x874, safe-area insets)
     - Foldable Unfolded (iPhone Duo / Pixel Fold: 700px - 960px)
     - Laptop / Desktop (1024px - 1440px+)
   ========================================================================== */

:root {
  --bg-app: #eef2f7;
  --bg-surface: #ffffff;
  --bg-subtle: #f6f8fc;
  --bg-elevated: #ffffff;
  --bg-sheet-well: #dfe6f0;

  --court-navy: #0d2240;
  --court-navy-2: #16335e;
  --court-navy-soft: #e6edf7;

  --volley-blue: #1858cc;
  --volley-blue-hover: #1246a6;
  --volley-blue-soft: #e8f0fe;

  --team-b-accent: #0f766e;
  --team-b-hover: #0d5f59;
  --team-b-soft: #e6f7f5;

  --signal-amber: #f59e0b;
  --signal-amber-dark: #b45309;
  --signal-amber-soft: #fef3c7;

  --success-green: #15803d;
  --success-soft: #dcfce7;

  --danger-red: #dc2626;
  --danger-hover: #b91c1c;
  --danger-soft: #fee2e2;

  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #64748b;
  --text-on-dark: #ffffff;

  --border-light: #d8e1ec;
  --border-strong: #b6c4d6;
  --focus-ring: 0 0 0 3px rgba(24, 88, 204, 0.32);

  --shadow-sm: 0 1px 3px rgba(13, 34, 64, 0.08);
  --shadow-md: 0 4px 14px rgba(13, 34, 64, 0.11);
  --shadow-lg: 0 14px 36px rgba(13, 34, 64, 0.22);

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-pill: 999px;

  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);

  --topbar-h: 92px;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: var(--bg-app);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}

button,
input,
select,
textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}

.tabular {
  font-variant-numeric: tabular-nums;
}

/* ==========================================================================
   App Shell & Top Persistent Bar
   ========================================================================== */

.mb-app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
  padding-left: var(--safe-left);
  padding-right: var(--safe-right);
}

.mb-topbar {
  position: sticky;
  top: 0;
  z-index: 200;
  background: var(--court-navy);
  color: var(--text-on-dark);
  padding-top: var(--safe-top);
  box-shadow: 0 2px 10px rgba(13, 34, 64, 0.22);
}

.mb-topbar-upper {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 6px 10px 4px;
  min-height: 46px;
}

.mb-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.mb-brand-logo {
  width: 28px;
  height: 28px;
  border-radius: 7px;
  background: rgba(255, 255, 255, 0.12);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.mb-brand-title {
  font-weight: 800;
  font-size: 15px;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mb-offline-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: var(--radius-pill);
  background: rgba(21, 128, 61, 0.28);
  border: 1px solid rgba(134, 239, 172, 0.45);
  color: #bbf7d0;
  white-space: nowrap;
  flex-shrink: 0;
}

.mb-offline-pill.is-offline {
  background: rgba(245, 158, 11, 0.25);
  border-color: rgba(253, 224, 71, 0.55);
  color: #fde68a;
}

.mb-offline-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #4ade80;
}

.mb-offline-pill.is-offline .mb-offline-dot {
  background: #fbbf24;
}

.mb-topbar-actions {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}

.mb-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 38px;
  min-width: 38px;
  padding: 0 9px;
  border-radius: var(--radius-sm);
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.09);
  color: #ffffff;
  font-size: 12px;
  font-weight: 700;
  transition: background 0.14s ease, opacity 0.14s ease;
}

.mb-icon-btn:hover:not(:disabled) {
  background: rgba(255, 255, 255, 0.18);
}

.mb-icon-btn:disabled {
  opacity: 0.38;
  cursor: not-allowed;
}

.mb-lang-switch {
  display: inline-flex;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: var(--radius-sm);
  overflow: hidden;
}

.mb-lang-btn {
  min-height: 36px;
  min-width: 34px;
  padding: 0 7px;
  border: none;
  background: transparent;
  color: rgba(255, 255, 255, 0.78);
  font-size: 11px;
  font-weight: 800;
}

.mb-lang-btn.active {
  background: var(--signal-amber);
  color: #0f172a;
}

@media (max-width: 440px) {
  .mb-topbar-upper {
    padding: 5px 7px 3px;
    gap: 4px;
  }
  .mb-brand {
    gap: 5px;
  }
  .mb-brand-logo {
    width: 24px;
    height: 24px;
  }
  .mb-brand-title {
    font-size: 14px;
  }
  .mb-offline-pill {
    font-size: 10px;
    padding: 2px 6px;
    gap: 4px;
  }
  .mb-topbar-actions {
    gap: 3px;
  }
  .mb-icon-btn {
    min-width: 32px;
    min-height: 34px;
    padding: 0 6px;
  }
  .mb-lang-btn {
    min-width: 28px;
    min-height: 32px;
    padding: 0 5px;
  }
}

.mb-brand-prefix,
.mb-tab-extra {
  display: none;
}

@media (min-width: 480px) {
  .mb-brand-prefix,
  .mb-tab-extra {
    display: inline;
  }
}

.mb-undo-label {
  display: none;
}

@media (min-width: 560px) {
  .mb-undo-label {
    display: inline;
  }
}

/* Step Navigation Tabs */
.mb-step-tabs {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 3px;
  padding: 0 6px 6px;
}

.mb-step-tab {
  min-height: 38px;
  padding: 4px 3px;
  border: none;
  border-radius: 7px;
  background: rgba(255, 255, 255, 0.07);
  color: rgba(255, 255, 255, 0.84);
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background 0.15s ease, color 0.15s ease;
}

@media (max-width: 420px) {
  .mb-step-tab {
    font-size: 10.2px;
    padding: 4px 2px;
    gap: 2.5px;
  }
}

.mb-step-tab:hover {
  background: rgba(255, 255, 255, 0.15);
}

.mb-step-tab.active {
  background: #ffffff;
  color: var(--court-navy);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
}

.mb-step-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  font-size: 10px;
  font-weight: 800;
  background: rgba(255, 255, 255, 0.18);
  flex-shrink: 0;
}

.mb-step-tab.active .mb-step-num {
  background: var(--volley-blue);
  color: #ffffff;
}

/* Topbar Dropdown Menu */
.mb-menu-wrap {
  position: relative;
}

.mb-menu-popover {
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  min-width: 225px;
  background: var(--bg-surface);
  color: var(--text-primary);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  padding: 6px;
  z-index: 500;
}

.mb-menu-item {
  width: 100%;
  min-height: 46px;
  padding: 8px 12px;
  border: none;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 600;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 10px;
}

.mb-menu-item:hover {
  background: var(--bg-subtle);
}

.mb-menu-item.danger {
  color: var(--danger-red);
}

.mb-menu-item.danger:hover {
  background: var(--danger-soft);
}

.mb-menu-divider {
  height: 1px;
  background: var(--border-light);
  margin: 5px 0;
}

/* Last Action Strip (Desktop/Tooltip info) */
.mb-last-action-badge {
  display: none;
  max-width: 190px;
  font-size: 11px;
  color: #cbd5e1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 0 6px;
}

/* ==========================================================================
   Workspace Layout (Phone Portrait vs Foldable/Laptop Split)
   ========================================================================== */

.mb-workspace {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.mb-pane-controls {
  flex: 1;
  padding: 12px 12px calc(24px + var(--safe-bottom));
  max-width: 1120px;
  width: 100%;
  margin: 0 auto;
}

.mb-pane-sheet {
  display: none;
  background: var(--bg-sheet-well);
  border-bottom: 1px solid var(--border-strong);
  position: relative;
  overflow: hidden;
}

@media (max-width: 699px) {
  /* Phone Live Split Mode: Sheet on TOP (~38dvh), Cockpit BELOW without page scroll! */
  .mb-workspace.is-live-rally .mb-pane-sheet {
    display: flex;
    flex-direction: column;
    height: 38vh;
    height: 38dvh;
    min-height: 225px;
    max-height: 340px;
    flex-shrink: 0;
    order: -1;
  }

  .mb-workspace.is-live-rally {
    flex: none;
    height: calc(100vh - var(--topbar-h) - var(--safe-top));
    height: calc(100dvh - var(--topbar-h) - var(--safe-top));
    overflow: hidden;
  }

  .mb-workspace.is-live-rally .mb-pane-controls {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 8px 10px calc(10px + var(--safe-bottom));
  }

  /* Show Sheet in Review step on Phone too */
  .mb-workspace.is-review .mb-pane-sheet {
    display: flex;
    flex-direction: column;
    height: 42vh;
    height: 42dvh;
    min-height: 260px;
    order: -1;
  }

  /* Sheet Preview Toggle on Phone Setup/Rosters/Lineup */
  .mb-workspace.mobile-sheet-open .mb-pane-sheet {
    display: flex;
    flex-direction: column;
    height: 40vh;
    height: 40dvh;
    min-height: 250px;
    order: -1;
  }
}

/* ==========================================================================
   Foldables (700px+) & Laptop (1024px+): Dual-Pane Split Layout
   ========================================================================== */

@media (min-width: 700px) {
  .mb-step-tab {
    padding: 6px 10px;
    min-height: 38px;
    font-size: 12.5px;
    gap: 5px;
  }

  .mb-step-num {
    width: 18px;
    height: 18px;
    font-size: 11px;
  }

  /* Dual-Pane Split for Live & Review on >=700px (Foldables + Laptop) */
  .mb-workspace.is-live-step,
  .mb-workspace.is-review,
  .mb-workspace.desktop-split {
    flex: none;
    display: grid;
    grid-template-columns: minmax(330px, 46%) minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr);
    height: calc(100vh - var(--topbar-h) - var(--safe-top));
    height: calc(100dvh - var(--topbar-h) - var(--safe-top));
    max-height: calc(100dvh - var(--topbar-h) - var(--safe-top));
    overflow: hidden;
  }

  .mb-workspace.is-live-step .mb-pane-controls,
  .mb-workspace.is-review .mb-pane-controls,
  .mb-workspace.desktop-split .mb-pane-controls {
    height: 100%;
    min-height: 0;
    min-width: 0;
    overflow-y: auto;
    padding: 14px 16px 28px;
    max-width: none;
    margin: 0;
  }

  .mb-workspace.is-live-step .mb-pane-sheet,
  .mb-workspace.is-review .mb-pane-sheet,
  .mb-workspace.desktop-split .mb-pane-sheet {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
    min-width: 0;
    max-height: none;
    order: 2;
    border-bottom: none;
    border-left: 1px solid var(--border-strong);
  }
}

@media (min-width: 1024px) {
  /* On Laptop 1024px+, show Dual-Pane Split across ALL steps so user sees sheet live! */
  .mb-workspace {
    flex: none;
    display: grid;
    grid-template-columns: minmax(420px, 46%) minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr);
    height: calc(100vh - var(--topbar-h) - var(--safe-top));
    height: calc(100dvh - var(--topbar-h) - var(--safe-top));
    max-height: calc(100dvh - var(--topbar-h) - var(--safe-top));
    overflow: hidden;
  }

  .mb-workspace .mb-pane-controls {
    height: 100%;
    min-height: 0;
    min-width: 0;
    overflow-y: auto;
    padding: 18px 20px 36px;
    max-width: none;
    margin: 0;
  }

  .mb-workspace .mb-pane-sheet {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
    min-width: 0;
    max-height: none;
    order: 2;
    border-bottom: none;
    border-left: 1px solid var(--border-strong);
  }
}

@media (min-width: 1180px) {
  :root {
    --topbar-h: 58px;
  }

  .mb-last-action-badge {
    display: inline-block;
  }

  .mb-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: var(--safe-top) 16px 0;
    min-height: 58px;
  }

  .mb-topbar-upper {
    padding: 0;
    flex: 1 1 auto;
    min-width: 0;
    gap: 10px;
  }

  .mb-step-tabs {
    display: flex;
    gap: 6px;
    padding: 0;
    flex: 0 1 auto;
    justify-content: center;
  }

  .mb-step-tab {
    padding: 6px 12px;
    min-height: 40px;
    font-size: 13px;
  }
}

/* ==========================================================================
   Interactive Matchblatt Viewport (Pan, Zoom, Pills, Fullscreen)
   ========================================================================== */

.mb-sheet-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px 6px;
  padding: 5px 8px;
  background: #cfd9e6;
  border-bottom: 1px solid var(--border-strong);
  flex-shrink: 0;
  flex-wrap: wrap;
}

.mb-sheet-pills {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
}

.mb-pill-btn {
  min-height: 30px;
  padding: 3px 8px;
  border-radius: var(--radius-pill);
  border: 1px solid #aebcd0;
  background: #ffffff;
  color: var(--court-navy);
  font-size: 11.5px;
  font-weight: 700;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}

.mb-pill-btn:hover {
  background: var(--volley-blue-soft);
}

.mb-pill-btn.active {
  background: var(--court-navy);
  border-color: var(--court-navy);
  color: #ffffff;
}

.mb-pill-btn.edit-active {
  background: var(--signal-amber);
  border-color: var(--signal-amber-dark);
  color: #0f172a;
}

.mb-sheet-stage {
  flex: 1 1 0%;
  min-height: 0;
  min-width: 0;
  position: relative;
  overflow: hidden;
  background: #dde5f0;
  touch-action: none;
  cursor: grab;
  display: flex;
  align-items: center;
  justify-content: center;
}

.mb-sheet-stage.is-panning {
  cursor: grabbing;
}

.mb-sheet-transform {
  width: 100%;
  height: 100%;
  min-height: 0;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transform-origin: center center;
  will-change: transform;
}

.mb-sheet-mount {
  width: 100%;
  height: 100%;
  min-height: 0;
  min-width: 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6px;
}

.mb-sheet-mount svg {
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: 100%;
  overflow: hidden;
  background: #ffffff;
  box-shadow: 0 4px 18px rgba(13, 34, 64, 0.18);
  border-radius: 3px;
}

.mb-sheet-zoom-hud {
  position: absolute;
  right: 8px;
  bottom: 8px;
  display: flex;
  align-items: center;
  gap: 3px;
  background: rgba(13, 34, 64, 0.84);
  color: #ffffff;
  padding: 3px;
  border-radius: var(--radius-pill);
  backdrop-filter: blur(4px);
}

.mb-zoom-btn {
  min-width: 30px;
  min-height: 30px;
  border: none;
  border-radius: 50%;
  background: transparent;
  color: #ffffff;
  font-size: 14px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.mb-zoom-btn:hover {
  background: rgba(255, 255, 255, 0.18);
}

.mb-zoom-pct {
  font-size: 11px;
  font-weight: 700;
  padding: 0 5px;
  cursor: pointer;
}

/* Fullscreen Expanded Sheet */
.mb-pane-sheet.is-fullscreen {
  display: flex !important;
  position: fixed !important;
  inset: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  height: 100dvh !important;
  max-height: none !important;
  z-index: 950 !important;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
}

/* ==========================================================================
   Common Cards, Forms, & Buttons (>=48px Touch Targets)
   ========================================================================== */

.mb-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
  padding: 14px;
  margin-bottom: 12px;
}

.mb-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.mb-card-title {
  margin: 0;
  font-size: 16px;
  font-weight: 800;
  color: var(--court-navy);
  display: flex;
  align-items: center;
  gap: 7px;
}

.mb-card-subtitle {
  margin: 2px 0 0;
  font-size: 12.5px;
  color: var(--text-muted);
}

.mb-grid-2 {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

.mb-grid-3 {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

@media (min-width: 520px) {
  .mb-grid-2 {
    grid-template-columns: repeat(2, 1fr);
  }
  .mb-grid-3 {
    grid-template-columns: repeat(3, 1fr);
  }
}

.mb-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.mb-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-secondary);
}

.mb-input,
.mb-select,
.mb-textarea {
  min-height: 48px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: #ffffff;
  color: var(--text-primary);
  font-size: 15px;
  width: 100%;
}

.mb-textarea {
  min-height: 84px;
  resize: vertical;
}

.mb-input-sm {
  min-height: 44px;
  padding: 7px 9px;
  font-size: 14px;
}

.mb-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 48px;
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: #ffffff;
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 700;
  transition: background 0.14s ease, border-color 0.14s ease, transform 0.06s ease;
}

.mb-btn:active:not(:disabled) {
  transform: translateY(1px);
}

.mb-btn:hover:not(:disabled) {
  background: var(--bg-subtle);
}

.mb-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.mb-btn-primary {
  background: var(--volley-blue);
  border-color: var(--volley-blue);
  color: #ffffff;
}

.mb-btn-primary:hover:not(:disabled) {
  background: var(--volley-blue-hover);
}

.mb-btn-navy {
  background: var(--court-navy);
  border-color: var(--court-navy);
  color: #ffffff;
}

.mb-btn-navy:hover:not(:disabled) {
  background: var(--court-navy-2);
}

.mb-btn-amber {
  background: var(--signal-amber);
  border-color: var(--signal-amber-dark);
  color: #0f172a;
}

.mb-btn-amber:hover:not(:disabled) {
  background: #fbbf24;
}

.mb-btn-success {
  background: var(--success-green);
  border-color: var(--success-green);
  color: #ffffff;
}

.mb-btn-danger {
  background: var(--danger-red);
  border-color: var(--danger-red);
  color: #ffffff;
}

.mb-btn-danger:hover:not(:disabled) {
  background: var(--danger-hover);
}

.mb-btn-block {
  width: 100%;
}

/* Segmented Toggle */
.mb-seg {
  display: flex;
  background: var(--bg-subtle);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  padding: 3px;
  gap: 3px;
}

.mb-seg-btn {
  flex: 1;
  min-height: 42px;
  padding: 6px 10px;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 700;
}

.mb-seg-btn.active {
  background: var(--court-navy);
  color: #ffffff;
  box-shadow: var(--shadow-sm);
}

/* ==========================================================================
   Step 2: Rosters & Fast Jersey Entry
   ========================================================================== */

.mb-team-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
}

.mb-rosters-dual {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}

@media (min-width: 720px) and (max-width: 1023px) {
  .mb-rosters-dual {
    grid-template-columns: 1fr 1fr;
  }
  .mb-team-tabs {
    display: none;
  }
}

.mb-team-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  font-weight: 800;
  font-size: 13px;
  background: var(--volley-blue);
  color: #ffffff;
  flex-shrink: 0;
}

.mb-team-badge.team-b {
  background: var(--team-b-accent);
}

.mb-fast-add-bar {
  display: flex;
  gap: 8px;
  align-items: stretch;
  background: var(--volley-blue-soft);
  border: 1px solid #bfd4fb;
  padding: 10px;
  border-radius: var(--radius-sm);
  margin-bottom: 12px;
}

.mb-player-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.mb-player-row {
  display: grid;
  grid-template-columns: 60px 1fr 112px 44px 44px;
  gap: 6px;
  align-items: center;
  background: var(--bg-subtle);
  padding: 6px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-light);
}

@media (max-width: 440px) {
  .mb-player-row {
    grid-template-columns: 54px 1fr 42px 42px;
  }
  .mb-player-row .mb-bday-input {
    grid-column: 1 / -1;
  }
}

.mb-cap-btn {
  min-height: 44px;
  min-width: 42px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: #ffffff;
  color: var(--text-muted);
  font-weight: 800;
  font-size: 13px;
}

.mb-cap-btn.active {
  background: var(--signal-amber);
  border-color: var(--signal-amber-dark);
  color: #0f172a;
}

.mb-del-btn {
  min-height: 44px;
  min-width: 42px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-light);
  background: #ffffff;
  color: var(--danger-red);
  font-weight: 800;
  font-size: 16px;
}

/* ==========================================================================
   Step 3A: Start-of-Set Lineup 6-Position Court Tap-Grid
   ========================================================================== */

.mb-lineup-grid-wrap {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

@media (min-width: 600px) and (max-width: 1023px) {
  .mb-lineup-grid-wrap {
    grid-template-columns: 1fr 1fr;
  }
}

.mb-court-entry {
  background: linear-gradient(180deg, #fff7ed 0%, #ffedd5 100%);
  border: 2px solid #ea580c;
  border-radius: var(--radius-md);
  padding: 10px;
}

.mb-net-label {
  text-align: center;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #9a3412;
  padding-bottom: 6px;
  margin-bottom: 8px;
  border-bottom: 3px dashed #ea580c;
}

.mb-court-6grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.mb-zone-slot {
  min-height: 62px;
  border-radius: var(--radius-sm);
  border: 2px solid #fdba74;
  background: #ffffff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 6px;
  position: relative;
}

.mb-zone-slot.selected {
  border-color: var(--volley-blue);
  box-shadow: 0 0 0 3px rgba(24, 88, 204, 0.28);
  background: var(--volley-blue-soft);
}

.mb-zone-slot.filled {
  border-color: var(--court-navy);
}

.mb-zone-roman {
  position: absolute;
  top: 4px;
  left: 6px;
  font-size: 11px;
  font-weight: 800;
  color: var(--text-muted);
}

.mb-zone-srv-tag {
  position: absolute;
  top: 4px;
  right: 5px;
  font-size: 10px;
  font-weight: 800;
  color: var(--signal-amber-dark);
}

.mb-zone-num {
  font-size: 22px;
  font-weight: 900;
  color: var(--court-navy);
  margin-top: 8px;
}

.mb-roster-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}

.mb-jersey-chip {
  min-width: 48px;
  min-height: 48px;
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: #ffffff;
  color: var(--court-navy);
  font-weight: 800;
  font-size: 15px;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  line-height: 1.1;
}

.mb-jersey-chip.used {
  background: var(--court-navy);
  border-color: var(--court-navy);
  color: #ffffff;
}

.mb-jersey-chip.is-libero {
  background: #fef9c3;
  border-color: #eab308;
  border-style: dashed;
  color: #854d0e;
}

.mb-jersey-chip small {
  font-size: 10px;
  font-weight: 600;
  opacity: 0.82;
  max-width: 58px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ==========================================================================
   Step 3B: Live Rally Cockpit (High-Speed Scorer Ergonomics)
   ========================================================================== */

.mb-live-cockpit {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* Alert Banners (Set Point / End Set / 8-Point Switch / Timeout Timer) */
.mb-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-md);
  font-size: 13.5px;
  font-weight: 700;
  flex-wrap: wrap;
}

.mb-banner-win {
  background: #dcfce7;
  border: 2px solid #16a34a;
  color: #14532d;
}

.mb-banner-switch8 {
  background: var(--signal-amber-soft);
  border: 2px solid var(--signal-amber);
  color: #78350f;
}

.mb-banner-timer {
  background: var(--court-navy);
  color: #ffffff;
  padding: 8px 12px;
}

/* Prominent Scoreboard + Giant +1 Buttons */
.mb-score-deck {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 8px;
  align-items: stretch;
}

.mb-score-btn {
  min-height: 92px;
  padding: 8px 10px;
  border-radius: var(--radius-md);
  border: 2px solid var(--volley-blue);
  background: linear-gradient(180deg, #1d63dc 0%, #1449ab 100%);
  color: #ffffff;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-align: left;
  box-shadow: 0 4px 12px rgba(20, 73, 171, 0.28);
  position: relative;
  overflow: hidden;
}

.mb-score-btn.right-side {
  border-color: var(--team-b-accent);
  background: linear-gradient(180deg, #118279 0%, #0b5c56 100%);
  box-shadow: 0 4px 12px rgba(11, 92, 86, 0.28);
}

.mb-score-btn:active:not(:disabled) {
  transform: scale(0.985);
}

.mb-score-btn-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  width: 100%;
}

.mb-score-team-name {
  font-size: 13px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mb-serve-pill {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 7px;
  border-radius: var(--radius-pill);
  background: var(--signal-amber);
  color: #0f172a;
  font-size: 11px;
  font-weight: 900;
  flex-shrink: 0;
}

.mb-score-btn-main {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  width: 100%;
  margin-top: 2px;
}

.mb-score-big {
  font-size: 38px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -0.02em;
}

.mb-plus-one-chip {
  font-size: 16px;
  font-weight: 900;
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  background: rgba(255, 255, 255, 0.22);
  border: 1px solid rgba(255, 255, 255, 0.4);
}

.mb-score-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 6px 8px;
  background: var(--bg-surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  min-width: 64px;
  text-align: center;
}

.mb-set-pill {
  font-size: 11px;
  font-weight: 900;
  text-transform: uppercase;
  color: var(--court-navy);
  background: var(--court-navy-soft);
  padding: 2px 7px;
  border-radius: var(--radius-pill);
}

.mb-sets-tally {
  font-size: 18px;
  font-weight: 900;
  color: var(--text-primary);
}

.mb-side-labels {
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
}

/* Mini Dual Court Rotation Diagram */
.mb-mini-court-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 7px 8px;
}

.mb-mini-courts {
  display: grid;
  grid-template-columns: 1fr 6px 1fr;
  gap: 6px;
  align-items: stretch;
}

.mb-mini-net {
  background: repeating-linear-gradient(
    to bottom,
    var(--court-navy) 0px,
    var(--court-navy) 5px,
    #cbd5e1 5px,
    #cbd5e1 9px
  );
  border-radius: 3px;
}

.mb-mini-half {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  background: #fffbeb;
  border: 1.5px solid #f59e0b;
  border-radius: var(--radius-sm);
  padding: 4px;
}

.mb-mini-cell {
  min-height: 36px;
  background: #ffffff;
  border: 1px solid #fde68a;
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: 2px;
}

.mb-mini-cell.active-server {
  background: var(--signal-amber-soft);
  border: 2px solid var(--signal-amber-dark);
}

.mb-mini-zone {
  position: absolute;
  top: 1px;
  left: 3px;
  font-size: 8.5px;
  font-weight: 800;
  color: var(--text-muted);
}

.mb-mini-num {
  font-size: 14px;
  font-weight: 900;
  color: var(--court-navy);
  margin-top: 5px;
}

/* Live Action Grid (>=48px buttons) */
.mb-live-actions {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
}

.mb-action-btn {
  min-height: 48px;
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--bg-surface);
  color: var(--court-navy);
  font-size: 13px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.mb-action-btn:hover:not(:disabled) {
  background: var(--bg-subtle);
  border-color: var(--court-navy);
}

.mb-count-badge {
  font-size: 11px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: var(--radius-pill);
  background: var(--court-navy-soft);
  color: var(--court-navy);
}

.mb-count-badge.warn {
  background: var(--signal-amber-soft);
  color: var(--signal-amber-dark);
}

.mb-live-utility-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.mb-kbd-hint {
  display: none;
  font-size: 11.5px;
  color: var(--text-muted);
  text-align: center;
  padding-top: 4px;
}

@media (min-width: 1024px) {
  .mb-kbd-hint {
    display: block;
  }
}

/* ==========================================================================
   Step 4: Summary Table, Signatures, & Export Bar
   ========================================================================== */

.mb-summary-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.mb-summary-table th,
.mb-summary-table td {
  padding: 7px 6px;
  border-bottom: 1px solid var(--border-light);
  text-align: center;
}

.mb-summary-table th {
  background: var(--bg-subtle);
  font-weight: 800;
  color: var(--court-navy);
  font-size: 11.5px;
}

.mb-summary-table tr.total-row td {
  font-weight: 900;
  background: var(--court-navy-soft);
  border-top: 2px solid var(--court-navy);
}

.mb-sig-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

@media (min-width: 600px) {
  .mb-sig-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

.mb-sig-slot {
  min-height: 76px;
  padding: 8px;
  border-radius: var(--radius-sm);
  border: 1px dashed var(--border-strong);
  background: var(--bg-subtle);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  text-align: center;
}

.mb-sig-slot.signed {
  border-style: solid;
  border-color: var(--success-green);
  background: #f0fdf4;
}

.mb-sig-slot img {
  max-height: 36px;
  max-width: 100%;
  object-fit: contain;
}

.mb-export-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

@media (min-width: 560px) {
  .mb-export-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

/* ==========================================================================
   Modals, Signature Pad Canvas, & Toast Notifications
   ========================================================================== */

.mb-modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(13, 34, 64, 0.62);
  backdrop-filter: blur(2px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
}

.mb-modal {
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  max-height: 90dvh;
  overflow-y: auto;
  background: var(--bg-surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  padding: 16px;
  border: 1px solid var(--border-strong);
}

.mb-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 12px;
}

.mb-modal-title {
  margin: 0;
  font-size: 17px;
  font-weight: 800;
  color: var(--court-navy);
}

.mb-alert-warn {
  background: var(--signal-amber-soft);
  border: 1.5px solid var(--signal-amber);
  color: #78350f;
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-size: 13px;
  font-weight: 700;
  margin: 10px 0;
}

.mb-sig-canvas-wrap {
  border: 2px solid var(--court-navy);
  border-radius: var(--radius-md);
  background: #ffffff;
  overflow: hidden;
  touch-action: none;
}

.mb-sig-canvas {
  display: block;
  width: 100%;
  height: 190px;
  touch-action: none;
  cursor: crosshair;
}

.mb-toast-stack {
  position: fixed;
  bottom: calc(14px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%);
  z-index: 1200;
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-width: 92vw;
  pointer-events: none;
}

.mb-toast {
  background: var(--court-navy);
  color: #ffffff;
  padding: 10px 16px;
  border-radius: var(--radius-pill);
  font-size: 13px;
  font-weight: 700;
  box-shadow: var(--shadow-lg);
  text-align: center;
}

.mb-toast.amber {
  background: var(--signal-amber);

    if (inOnCourt) {
      error = tr('warnings.playerAlreadyOnCourt', lang, { number: inNorm });
      return { valid: false, ok: false, warnings: warnings, error: error, canOverride: false, colIndex: -1 };
    }

    var colIndex = findCourtColumnIndex(lineup, outNorm);
    var col = lineup.positions[colIndex];

    // Check active / injured Libero
    if (isActiveLibero(teamObj, inNorm)) {
      warnings.push(tr('warnings.liberoCannotSub', lang, { number: inNorm }));
    } else if (isInjuredLibero(teamObj, inNorm)) {
      warnings.push(tr('warnings.liberoInjuredReplaced', lang, { number: inNorm }));
    }

    // Check max 6 team substitutions per set
    if (set.subCount[team] >= 6) {
      warnings.push(tr('warnings.maxSubsReached', lang, { team: teamLabel, set: set.number }));
    }

    // Check whether incoming player has already played in a DIFFERENT column in this set
    for (var c = 0; c < 6; c++) {
      if (c === colIndex) continue;
      var otherCol = lineup.positions[c];
      var playedInOther =
        normalizeNumber(otherCol.starter) === inNorm ||
        (otherCol.sub !== null && normalizeNumber(otherCol.sub) === inNorm) ||
        (Array.isArray(otherCol.extraSubs) && otherCol.extraSubs.indexOf(inNorm) !== -1);
      if (playedInOther) {
        warnings.push(
          tr('warnings.subPlayerLockedOtherPos', lang, {
            number: inNorm,
            pos: ROMAN_POSITIONS[c],
            set: set.number
          })
        );
        break;
      }
    }

    // Check FIVB pair-lock rule within this column
    if (col) {
      if (col.sub !== null && col.subReentered) {
        warnings.push(
          tr('warnings.subAlreadyReentered', lang, {
            pos: ROMAN_POSITIONS[colIndex],
            starter: col.starter,
            sub: col.sub
          })
        );
      } else if (col.sub !== null && !col.subReentered) {
        if (inNorm !== normalizeNumber(col.starter)) {
          warnings.push(
            tr('warnings.subLockedToStarter', lang, {
              pos: ROMAN_POSITIONS[colIndex],
              starter: col.starter,
              sub: col.sub
            })
          );
        }
      }
    }

    return {
      valid: warnings.length === 0 && !error,
      ok: warnings.length === 0 && !error,
      warnings: warnings,
      error: error,
      canOverride: !error,
      colIndex: colIndex
    };
  }

  function validateTimeout(state, team, setIndex) {
    var lang = (state && state.lang) || 'en';
    var warnings = [];
    var error = null;

    if (!state || !validTeamKey(team)) {
      return { valid: false, ok: false, warnings: warnings, error: 'Invalid team' };
    }
    var idx = setIndex != null ? setIndex : state.currentSetIndex;
    var set = state.sets[idx];
    if (!set || set.status !== 'live') {
      return { valid: false, ok: false, warnings: warnings, error: 'Set is not live' };
    }
    var teamLabel = (state.teams[team] && state.teams[team].name) || ('Team ' + team);
    if (set.timeouts[team].length >= 2) {
      warnings.push(tr('warnings.maxTimeoutsReached', lang, { team: teamLabel, set: set.number }));
    }
    return {
      valid: warnings.length === 0,
      ok: warnings.length === 0,
      warnings: warnings,
      error: null
    };
  }

  /**
   * Internal helper to apply a single rally point (including side-out rotation & deciding-set 8-pt switch).
   */
  function applyRallyPointMut(state, setIndex, scoringTeam, byPenalty) {
    var set = state.sets[setIndex];
    var opp = oppTeam(scoringTeam);
    var wasPreSwitch = !set.switchedAt8;

    set.firstRallyPlayed = true;
    set.points[scoringTeam] += 1;
    var newScore = set.points[scoringTeam];

    set.slashedPoints[scoringTeam].push({
      point: newScore,
      postSwitch: set.switchedAt8,
      byPenalty: Boolean(byPenalty)
    });

    state.highlights.push({
      section: 'set',
      setIndex: setIndex,
      team: scoringTeam,
      point: newScore,
      postSwitch: set.switchedAt8,
      field: 'score'
    });

    var wasSideOut = scoringTeam !== set.servingTeam;
    if (wasSideOut) {
      var oldSrv = set.servingTeam;
      var oldLineup = set.lineups[oldSrv];
      if (oldLineup && Array.isArray(oldLineup.positions)) {
        var oldColIdx = oldLineup.serverPosIndex || 0;
        var oldTurns = oldLineup.positions[oldColIdx].serviceTurns;
        if (oldTurns.length > 0 && oldTurns[oldTurns.length - 1].exitScore === null) {
          oldTurns[oldTurns.length - 1].exitScore = set.points[oldSrv];
          state.highlights.push({
            section: 'set',
            setIndex: setIndex,
            team: oldSrv,
            col: oldColIdx,
            turnIndex: oldTurns.length - 1,
            field: 'service'
          });
        }
      }

      // Rotate scoring team clockwise by 1: II->I, III->II, IV->III, V->IV, VI->V, I->VI
      var newLineup = set.lineups[scoringTeam];
      if (newLineup && Array.isArray(newLineup.court) && newLineup.court.length === 6) {
        var c = newLineup.court;
        newLineup.court = [c[1], c[2], c[3], c[4], c[5], c[0]];
        newLineup.serverPosIndex = ((newLineup.serverPosIndex || 0) + 1) % 6;
        var newColIdx = newLineup.serverPosIndex;
        newLineup.positions[newColIdx].serviceTurns.push({
          initialCheck: true,
          exitScore: null,
          postSwitch: set.switchedAt8
        });
        state.highlights.push({
          section: 'set',
          setIndex: setIndex,
          team: scoringTeam,
          col: newColIdx,
          turnIndex: newLineup.positions[newColIdx].serviceTurns.length - 1,
          field: 'service'
        });
      }

      set.servingTeam = scoringTeam;
    }

    // Deciding Set automatic side switch at 8 points
    if (set.isDeciding && wasPreSwitch && (set.points.A >= 8 || set.points.B >= 8)) {
      set.pointsAtSwitch = { A: set.points.A, B: set.points.B };
      set.switchedAt8 = true;
      var tmpLeft = set.leftTeam;
      set.leftTeam = set.rightTeam;
      set.rightTeam = tmpLeft;
      state.justSwitchedAt8 = true;

      // If initialLeftTeam is actively serving across the 8-point court switch, mark its open serviceTurn postSwitch: true
      // so Panel 3 records the exit score cleanly when that service rotation concludes.
      var srvTeam = set.servingTeam;
      var srvLineup = set.lineups[srvTeam];
      if (srvLineup && Array.isArray(srvLineup.positions)) {
        var activeCol = srvLineup.serverPosIndex || 0;
        var activeTurns = srvLineup.positions[activeCol].serviceTurns;
        if (activeTurns.length > 0 && activeTurns[activeTurns.length - 1].exitScore === null) {
          activeTurns[activeTurns.length - 1].postSwitch = true;
          activeTurns[activeTurns.length - 1].carriedOverSwitch = !wasSideOut;
        }
      }

      state.highlights.push({
        section: 'set',
        setIndex: setIndex,
        team: set.initialLeftTeam,
        point: set.points[scoringTeam],
        field: 'switch8'
      });
    }

    refreshSetWinFlags(state);
    return { wasSideOut: wasSideOut, opp: opp };
  }

  function applyLineupToTeamMut(state, set, setIndex, team, starters) {
    var normalized = starters.map(normalizeNumber);
    var teamObj = state.teams[team];
    for (var i = 0; i < 6; i++) {
      ensurePlayerOnRoster(teamObj, normalized[i]);
    }
    set.lineups[team] = {
      starters: normalized.slice(),
      court: normalized.slice(),
      serverPosIndex: 0,
      positions: normalized.map(function (num) {
        return {
          starter: num,
          sub: null,
          subReentered: false,
          subScores: [],
          serviceTurns: []
        };
      })
    };
    state.highlights.push({
      section: 'set',
      setIndex: setIndex,
      team: team,
      field: 'lineup'
    });
  }

  function appendRemarkLine(state, text) {
    if (!text) return;
    state.remarks = state.remarks ? state.remarks + '\n' + text : text;
  }

  /**
   * Dispatch an action against `doc`, returning `{ doc: nextDoc, warnings: string[], error: string|null }`.
   * If validation fails or warnings require `action.force === true`, returns the original `doc` unmutated.
   */
  function dispatch(doc, action) {
    if (!doc || !doc.state) {
      return { doc: doc, warnings: [], error: 'Invalid store document' };
    }
    if (!action || typeof action.type !== 'string') {
      return { doc: doc, warnings: [], error: 'Action must have a string type' };
    }

    var prevState = doc.state;
    var lang = prevState.lang || 'en';
    var type = action.type;
    var warnings = [];

    // Pre-mutation validations that may return early without cloning/mutating
    if (type === ACTIONS.SET_LINEUP) {
      var targetSetIdx = action.setIndex != null ? action.setIndex : prevState.currentSetIndex;
      if (!prevState.sets[targetSetIdx]) {
        return { doc: doc, warnings: [], error: 'Invalid setIndex' };
      }

      var lineupInputs = [];
      if (action.lineups && typeof action.lineups === 'object') {
        if (action.lineups.A) lineupInputs.push({ team: 'A', starters: action.lineups.A });
        if (action.lineups.B) lineupInputs.push({ team: 'B', starters: action.lineups.B });
      }
      if (action.startersA) lineupInputs.push({ team: 'A', starters: action.startersA });
      if (action.startersB) lineupInputs.push({ team: 'B', starters: action.startersB });
      if (validTeamKey(action.team) && Array.isArray(action.starters)) {
        lineupInputs.push({ team: action.team, starters: action.starters });
      }

      if (lineupInputs.length === 0) {
        return { doc: doc, warnings: [], error: 'No team starters provided for SET_LINEUP' };
      }

      var luWarnings = [];
      for (var li = 0; li < lineupInputs.length; li++) {
        var check = validateLineup(prevState, lineupInputs[li].team, lineupInputs[li].starters, targetSetIdx);
        if (check.error && !action.force) {
          return { doc: doc, warnings: check.warnings, error: check.error };
        }
        for (var lw = 0; lw < check.warnings.length; lw++) {
          luWarnings.push(check.warnings[lw]);
        }
      }
      if (luWarnings.length > 0 && !action.force) {
        return { doc: doc, warnings: luWarnings, error: null };
      }
      warnings = luWarnings;
    }

    if (type === ACTIONS.CONFIRM_SET_START || type === 'START_SET') {
      var startIdx = action.setIndex != null ? action.setIndex : prevState.currentSetIndex;
      var curSet = prevState.sets[startIdx];
      if (!curSet) {
        return { doc: doc, warnings: [], error: 'Invalid setIndex' };
      }
      var candA =
        (action.lineups && action.lineups.A) ||
        action.startersA ||
        (curSet.lineups.A && curSet.lineups.A.starters);
      var candB =
        (action.lineups && action.lineups.B) ||
        action.startersB ||
        (curSet.lineups.B && curSet.lineups.B.starters);

      var valA = validateLineup(prevState, 'A', candA, startIdx);
      var valB = validateLineup(prevState, 'B', candB, startIdx);
      if (valA.error || valB.error) {
        return {
          doc: doc,
          warnings: valA.warnings.concat(valB.warnings),
          error: valA.error || valB.error
        };
      }
      var startWarnings = valA.warnings.concat(valB.warnings);
      if (startWarnings.length > 0 && !action.force) {
        return { doc: doc, warnings: startWarnings, error: null };
      }
      warnings = startWarnings;
    }

    if (type === ACTIONS.SCORE_POINT) {
      var spIdx = action.setIndex != null ? action.setIndex : prevState.currentSetIndex;
      var spSet = prevState.sets[spIdx];
      if (!spSet || spSet.status !== 'live') {
        return { doc: doc, warnings: [], error: 'Cannot score points before set has started' };
      }
      var resolvedScoringTeam = validTeamKey(action.team)
        ? action.team
        : action.side === 'left'
          ? spSet.leftTeam
          : action.side === 'right'
            ? spSet.rightTeam
            : null;
      if (!validTeamKey(resolvedScoringTeam)) {
        return { doc: doc, warnings: [], error: 'Invalid scoring team' };
      }
      if (detectSetWinner(spSet) && !action.force) {
        return {
          doc: doc,
          warnings: [tr('warnings.setAlreadyWon', lang, { set: spSet.number })],
          error: null
        };
      }
    }

    if (type === ACTIONS.FINISH_SET || type === 'END_SET' || type === 'CONFIRM_SET_END') {
      var finIdx = action.setIndex != null ? action.setIndex : prevState.currentSetIndex;
      var finSet = prevState.sets[finIdx];
      if (!finSet || finSet.status === 'finished') {
        return { doc: doc, warnings: [], error: 'Set is already finished or invalid' };
      }
      var detWinner = detectSetWinner(finSet);
      if (!detWinner && !action.force) {
        return {
          doc: doc,
          warnings: [],
          error: 'Set winning score (target points with 2-point lead) has not been reached'
        };
      }
    }

    if (type === ACTIONS.SUBSTITUTE) {
      var subCheck = validateSubstitution(prevState, action.team, action.outNumber, action.inNumber, action.setIndex);
      if (subCheck.error) {
        return { doc: doc, warnings: subCheck.warnings, error: subCheck.error };
      }
      if (subCheck.warnings.length > 0 && !action.force) {
        return { doc: doc, warnings: subCheck.warnings, error: null };
      }
      warnings = subCheck.warnings;
    }

    if (type === ACTIONS.TIMEOUT) {
      var toCheck = validateTimeout(prevState, action.team, action.setIndex);
      if (toCheck.error) {
        return { doc: doc, warnings: toCheck.warnings, error: toCheck.error };
      }
      if (toCheck.warnings.length > 0 && !action.force) {
        return { doc: doc, warnings: toCheck.warnings, error: null };
      }
      warnings = toCheck.warnings;
    }

    if (type === ACTIONS.IMPROPER_REQUEST) {
      if (!validTeamKey(action.team)) {
        return { doc: doc, warnings: [], error: 'Invalid team' };
      }
      if (prevState.improperRequests[action.team] && !action.force) {
        var irTeamLabel = prevState.teams[action.team].name || ('Team ' + action.team);
        return {
          doc: doc,
          warnings: [tr('warnings.improperRequestAlreadyRecorded', lang, { team: irTeamLabel })],
          error: null
        };
      }
    }

    if (type === ACTIONS.REDESIGNATE_LIBERO) {
      if (!validTeamKey(action.team)) {
        return { doc: doc, warnings: [], error: 'Invalid team' };
      }
      var newLibCandidate = normalizeNumber(
        action.newLiberoNumber != null
          ? action.newLiberoNumber
          : action.newNumber != null
            ? action.newNumber
            : action.replacementNumber != null
              ? action.replacementNumber
              : action.playerNumber != null
                ? action.playerNumber
                : action.inNumber != null
                  ? action.inNumber
                  : action.number
      );
      if (!newLibCandidate) {
        return { doc: doc, warnings: [], error: 'New Libero jersey number is required' };
      }
      var liveSet = getCurrentSet(prevState);
      if (
        liveSet &&
        liveSet.status === 'live' &&
        liveSet.lineups[action.team] &&
        Array.isArray(liveSet.lineups[action.team].court) &&
        liveSet.lineups[action.team].court.indexOf(newLibCandidate) !== -1 &&
        !action.force
      ) {
        return {
          doc: doc,
          warnings: [tr('warnings.playerAlreadyOnCourt', lang, { number: newLibCandidate })],
          error: null
        };
      }
    }

    // Clone next state cleanly for immutable update
    var state = deepClone(prevState);
    state.highlights = [];
    state.justSwitchedAt8 = false;
    state.lastActionType = type;

    switch (type) {
      case ACTIONS.SET_LANGUAGE:
      case 'SET_LANG':
      case 'CHANGE_LANGUAGE': {
        if (action.lang === 'en' || action.lang === 'de') {
          state.lang = action.lang;
          lang = state.lang;
        }
        state.lastActionLabel = state.lang === 'de' ? 'Sprache: Deutsch' : 'Language: English';
        break;
      }

      case ACTIONS.SET_PHASE: {
        var allowedPhases = ['setup', 'rosters', 'lineup', 'live', 'finished'];
        if (allowedPhases.indexOf(action.phase) !== -1) {
          state.phase = action.phase;
        }
        state.lastActionLabel = 'Phase: ' + state.phase;
        break;
      }

      case ACTIONS.UPDATE_META: {
        var rawPatch = action.meta && typeof action.meta === 'object' ? action.meta : action;
        var patch = Object.assign({}, rawPatch);
        if (action.key && action.value !== undefined && patch[action.key] === undefined) {
          patch[action.key] = action.value;
        }
        var prevBestOf = state.meta.bestOf;
        var metaFields = [
          'competition',
          'category',
          'matchNumber',
          'city',
          'hall',
          'federation',
          'date',
          'time',
          'referee1',
          'referee2',
          'scorer',
          'assistantScorer'
        ];
        for (var mf = 0; mf < metaFields.length; mf++) {
          var field = metaFields[mf];
          if (patch[field] !== undefined) {
            state.meta[field] = String(patch[field]);
            state.highlights.push({ section: 'header', field: field });
          }
        }
        if (patch.matchType !== undefined) {
          state.meta.matchType = normalizeMatchType(patch.matchType);
          state.highlights.push({ section: 'header', field: 'matchType' });
        }
        if (patch.level !== undefined) {
          state.meta.level = normalizeLevel(patch.level, state.meta.level || 'regional');
          state.highlights.push({ section: 'header', field: 'level' });
        }
        if (patch.gender !== undefined) {
          state.meta.gender = normalizeGender(patch.gender, state.meta.category, state.meta.gender);
          state.highlights.push({ section: 'header', field: 'gender' });
        } else if (patch.category !== undefined) {
          state.meta.gender = inferGenderFromCategory(patch.category, state.meta.gender || 'women');
        }
        if (patch.ageGroup !== undefined) {
          state.meta.ageGroup = normalizeAgeGroup(patch.ageGroup, '');
          state.highlights.push({ section: 'header', field: 'ageGroup' });
        } else if (patch.category !== undefined) {
          var inferredAge = inferAgeGroupFromCategory(patch.category);
          if (inferredAge) {
            state.meta.ageGroup = inferredAge;
          }
        }
        if ((patch.gender !== undefined || patch.ageGroup !== undefined) && patch.category === undefined) {
          state.meta.category = buildCategoryString(state.meta.gender, state.meta.ageGroup, lang);
        }
        if (Array.isArray(patch.lineJudges)) {
          state.meta.lineJudges = [
            String(patch.lineJudges[0] || ''),
            String(patch.lineJudges[1] || ''),
            String(patch.lineJudges[2] || ''),
            String(patch.lineJudges[3] || '')
          ];
          state.highlights.push({ section: 'officials', field: 'lineJudges' });
        }
        if (patch.bestOf !== undefined) {
          var nextBestOf = Number(patch.bestOf) === 3 ? 3 : 5;
          state.meta.bestOf = nextBestOf;
          if (nextBestOf !== prevBestOf) {
            state.sets = buildSetsForFormat(nextBestOf, state.toss, state.sets);
            if (state.currentSetIndex >= state.sets.length) {
              state.currentSetIndex = state.sets.length - 1;
            }
            refreshSetWinFlags(state);
          }
          state.highlights.push({ section: 'header', field: 'bestOf' });
        }
        state.lastActionLabel = tr('actions.metaUpdated', lang);
        break;
      }

      case ACTIONS.UPDATE_TOSS: {
        var tPatch = action.toss && typeof action.toss === 'object' ? action.toss : action;
        if (validTeamKey(tPatch.firstServeSet1)) {
          state.toss.firstServeSet1 = tPatch.firstServeSet1;
        }
        if (validTeamKey(tPatch.initialLeft)) {
          state.toss.initialLeft = tPatch.initialLeft;
        }
        if (tPatch.decidingFirstServe === null || validTeamKey(tPatch.decidingFirstServe)) {
          state.toss.decidingFirstServe = tPatch.decidingFirstServe;
        }
        if (tPatch.decidingInitialLeft === null || validTeamKey(tPatch.decidingInitialLeft)) {
          state.toss.decidingInitialLeft = tPatch.decidingInitialLeft;
        }
        syncUnplayedSetsWithToss(state);
        state.highlights.push({ section: 'header', field: 'toss' });
        state.lastActionLabel = tr('actions.tossUpdated', lang);
        break;
      }

      case ACTIONS.SWAP_TEAMS_AB: {
        var tmpTeam = state.teams.A;
        state.teams.A = state.teams.B;
        state.teams.B = tmpTeam;

        var sigs = state.signatures;
        var tmpCapPre = sigs.captainA_pre;
        sigs.captainA_pre = sigs.captainB_pre;
        sigs.captainB_pre = tmpCapPre;

        var tmpCoach = sigs.coachA;
        sigs.coachA = sigs.coachB;
        sigs.coachB = tmpCoach;

        var tmpCapPost = sigs.captainA_post;
        sigs.captainA_post = sigs.captainB_post;
        sigs.captainB_post = tmpCapPost;

        // If Set 1 hasn't played any rallies yet, swap any draft lineups entered for A & B
        for (var si = 0; si < state.sets.length; si++) {
          if (!state.sets[si].firstRallyPlayed && state.sets[si].status !== 'finished') {
            var tmpLu = state.sets[si].lineups.A;
            state.sets[si].lineups.A = state.sets[si].lineups.B;
            state.sets[si].lineups.B = tmpLu;
          }
        }

        state.highlights.push({ section: 'rosters', field: 'swapAB' });
        state.lastActionLabel = tr('actions.teamsSwappedAB', lang);
        break;
      }

      case ACTIONS.UPDATE_TEAM: {
        if (!validTeamKey(action.team)) {
          return { doc: doc, warnings: [], error: 'Invalid team key' };
        }
        var tKey = action.team;
        var targetTeam = state.teams[tKey];
        var src =
          (action.data && typeof action.data === 'object' && action.data) ||
          (action.patch && typeof action.patch === 'object' && action.patch) ||
          (action.updates && typeof action.updates === 'object' && action.updates) ||
          (action.teamData && typeof action.teamData === 'object' && action.teamData) ||
          action;

        if (src.name !== undefined) targetTeam.name = String(src.name);
        if (src.shortName !== undefined) targetTeam.shortName = String(src.shortName);
        if (src.color !== undefined) targetTeam.color = String(src.color);

        if (Array.isArray(src.players)) {
          var seenNums = Object.create(null);
          var cleanPlayers = [];
          var captainFound = false;
          for (var pi = 0; pi < src.players.length; pi++) {
            var np = normalizePlayer(src.players[pi]);
            if (!np || seenNums[np.number]) continue;
            seenNums[np.number] = true;
            if (np.isCaptain) {
              if (captainFound) np.isCaptain = false;
              else captainFound = true;
            }
            cleanPlayers.push(np);
            if (cleanPlayers.length >= 14) break;
          }
          targetTeam.players = cleanPlayers;
        }

        if (Array.isArray(src.liberos)) {
          var seenLibs = Object.create(null);
          var cleanLiberos = [];
          for (var lbi = 0; lbi < src.liberos.length; lbi++) {
            var nl = normalizeLibero(src.liberos[lbi]);
            if (!nl || seenLibs[nl.number]) continue;
            seenLibs[nl.number] = true;
            cleanLiberos.push(nl);
          }
          targetTeam.liberos = cleanLiberos;
        }

        if (src.officials && typeof src.officials === 'object') {
          var offKeys = ['coach', 'assistantCoach1', 'assistantCoach2', 'therapist', 'doctor'];
          for (var ok = 0; ok < offKeys.length; ok++) {
            var oField = offKeys[ok];
            if (src.officials[oField] !== undefined) {
              targetTeam.officials[oField] = String(src.officials[oField]);
            }
          }
        }

        state.highlights.push({ section: 'rosters', team: tKey });
        state.lastActionLabel = tr('actions.teamUpdated', lang, { team: targetTeam.name });
        break;
      }

      case ACTIONS.ADD_PLAYER:
      case ACTIONS.ADD_PLAYERS: {
        if (!validTeamKey(action.team)) {
          return { doc: doc, warnings: [], error: 'Invalid team key' };
        }
        var apTeam = state.teams[action.team];
        var rawItems = [];
        if (Array.isArray(action.players)) rawItems = action.players;
        else if (action.player) rawItems = [action.player];
        else if (action.numbers !== undefined) rawItems = parseQuickNumbers(action.numbers);
        else if (action.number !== undefined) rawItems = parseQuickNumbers(action.number);

      case ACTIONS.REDESIGNATE_LIBERO: {
        var rlKey = action.team;

            : action.oldNumber != null

              : action.injuredNumber != null
                ? action.injuredNumber
                : action.liberoNumber != null
                  ? action.liberoNumber
                  : action.outNumber
        );
        var inLibNum = normalizeNumber(
          action.newLiberoNumber != null
            ? action.newLiberoNumber
            : action.newNumber != null
              ? action.newNumber
              : action.replacementNumber != null
                ? action.replacementNumber
                : action.playerNumber != null
                  ? action.playerNumber
                  : action.inNumber != null
                    ? action.inNumber
                    : action.number
        );

        if (!outLibNum) {
          for (var fl = 0; fl < rlTeamObj.liberos.length; fl++) {

        if (outLibNum) {

        var curS = getCurrentSet(state);

      case ACTIONS.CONFIRM_SET_START:

        if (action.lineups && action.lineups.B) applyLineupToTeamMut(state, csSet, csIdx, 'B', action.lineups.B);
        if (action.startersA) applyLineupToTeamMut(state, csSet, csIdx, 'A', action.startersA);
        if (action.startersB) applyLineupToTeamMut(state, csSet, csIdx, 'B', action.startersB);

          csSet.leftTeam = action.leftTeam;
          csSet.rightTeam = oppTeam(action.leftTeam);

        var srv = csSet.firstServe;
        var rcv = oppTeam(srv);
        csSet.servingTeam = srv;
        csSet.status = 'live';
        csSet.startTime = action.startTime || csSet.startTime || formatNowHHMM();
        state.phase = 'live';

        // Reset court & initialize Position I service turns: ✓ for server, X for receiver
        ['A', 'B'].forEach(function (t) {
          var lu = csSet.lineups[t];
          lu.court = lu.starters.slice();
          lu.serverPosIndex = 0;
          for (var p = 0; p < 6; p++) {

              starter: lu.starters[p],
              sub: null,
              subReentered: false,
              subScores: [],
              serviceTurns: []
            };

        csSet.lineups[srv].positions[0].serviceTurns = [
          { initialCheck: true, exitScore: null, postSwitch: false }
        ];
        csSet.lineups[rcv].positions[0].serviceTurns = [
          { initialX: true, exitScore: null, postSwitch: false }
        ];

        state.highlights.push(
          { section: 'set', setIndex: csIdx, team: srv, col: 0, turnIndex: 0, field: 'service' },
          { section: 'set', setIndex: csIdx, team: rcv, col: 0, turnIndex: 0, field: 'service' }

      case ACTIONS.SCORE_POINT: {

        var tName = state.teams[scTeam].shortName || state.teams[scTeam].name || scTeam;

      case ACTIONS.FINISH_SET:

          if (state.sets[wi].winner === 'B') winsCount.B += 1;

      case ACTIONS.SUBSTITUTE: {

        var sType = action.sanctionType || action.subType || action.cardType || 'warning';

        var codeMap = {

        };
        var code = codeMap[sType] || 'W';
        var isDelay = sType === 'delayWarning' || sType === 'delayPenalty';
        var rawPerson = normalizeNumber(

            : action.playerNumber != null
              ? action.playerNumber
              : action.target != null
                ? action.target
                : isDelay
                  ? 'D'
                  : 'C'
        );
        var person = isDelay ? 'D' : (rawPerson || 'C');

        var teamPtsAtSanction = sanSet.points[sanTeam];
        var oppPtsAtSanction = sanSet.points[sanOpp];
        var shouldAwardPoint =
          (sType === 'penalty' || sType === 'delayPenalty') &&

          !detectSetWinner(sanSet);

        var sanctionRecord = {

          type: sType,
          sanctionType: sType,
          code: code,
          isDelay: isDelay,
          person: person,
          target: person,
          team: sanTeam,

  /**
   * Renders the authentic Swiss Volley Left Legend Column beside Set 1, Set 3, and Set 5.
   */
  function renderSetRowLegend(x, yTopOfRom, w, bodyH, turnRowsCount) {
    var out = [];
    var romH = 21;
    var startH = 20;
    var subH = 16;
    var scH = 24; // 2 sub-score rows (12px + 12px)
    var upperH = romH + startH + subH + scH; // 81px
    var turnsY = yTopOfRom + upperH;
    var turnsH = bodyH - upperH;
    var turnRowH = turnsH / turnRowsCount;

    var vStripW = 58;
    var subSplitX = x + w - 79; // 79px on right for Nr. Spieler / Spielstand & paired round numbers

    out.push('<rect class="mb-box" x="' + x + '" y="' + yTopOfRom + '" width="' + w + '" height="' + bodyH + '" />');
    // Vertical divider after Mannschafts-Aufstellung (spans upperH)
    out.push('<line class="mb-grid" x1="' + (x + vStripW) + '" y1="' + yTopOfRom + '" x2="' + (x + vStripW) + '" y2="' + turnsY + '" />');
    // Horizontal lines in upper section
    out.push('<line class="mb-grid" x1="' + (x + vStripW) + '" y1="' + (yTopOfRom + romH) + '" x2="' + (x + w) + '" y2="' + (yTopOfRom + romH) + '" />');
    out.push('<line class="mb-grid" x1="' + (x + vStripW) + '" y1="' + (yTopOfRom + romH + startH) + '" x2="' + (x + w) + '" y2="' + (yTopOfRom + romH + startH) + '" />');
    // Split inside Substitution row
    var ySubTop = yTopOfRom + romH + startH;
    out.push('<line class="mb-grid" x1="' + subSplitX + '" y1="' + ySubTop + '" x2="' + subSplitX + '" y2="' + (yTopOfRom + bodyH) + '" />');
    out.push('<line class="mb-grid" x1="' + subSplitX + '" y1="' + (ySubTop + subH) + '" x2="' + (x + w) + '" y2="' + (ySubTop + subH) + '" />');
    // Strong divider above Aufschlagrunde
    out.push('<line class="mb-grid-strong" x1="' + x + '" y1="' + turnsY + '" x2="' + (x + w) + '" y2="' + turnsY + '" />');

    // Vertical text: Mannschafts-Aufstellung / Formation des équipes / Formazione delle squadre
    var vMidY = yTopOfRom + upperH / 2;
    out.push(
      '<text class="mb-fnt" x="' + (x + 17) + '" y="' + vMidY.toFixed(1) + '" font-size="6.2" text-anchor="middle" transform="rotate(-90 ' + (x + 17) + ' ' + vMidY.toFixed(1) + ')">Mannschafts-Aufstellung</text>'
    );
    out.push(
      '<text class="mb-fnt" x="' + (x + 31) + '" y="' + vMidY.toFixed(1) + '" font-size="6.2" text-anchor="middle" transform="rotate(-90 ' + (x + 31) + ' ' + vMidY.toFixed(1) + ')">Formation des équipes</text>'
    );
    out.push(
      '<text class="mb-fnt" x="' + (x + 45) + '" y="' + vMidY.toFixed(1) + '" font-size="6.2" text-anchor="middle" transform="rotate(-90 ' + (x + 45) + ' ' + vMidY.toFixed(1) + ')">Formazione delle squadre</text>'
    );

    // Row 1: Aufschlagfolge / Aufgabenfolge
    out.push(renderTriLabel(x + vStripW + 5, yTopOfRom + 8.5, [
      'Aufschlagfolge/Ordre au service/',
      'Ordine del servizio'
    ], 6.4, 8.2));

    // Row 2: Startaufstellung
    out.push(renderTriLabel(x + vStripW + 5, yTopOfRom + romH + 8.2, [
      'Startaufstellung/Formation',
      'initiale/Formazione iniziale'
    ], 6.4, 8.0));

    // Row 3..5 left: Spieler-auswechslung
    out.push(renderTriLabel(x + vStripW + 5, ySubTop + 8.2, [
      'Spieler-',
      'auswechslung',
      'Remplacement',
      'des joueurs',
      'Sostituzione'
    ], 6.1, 7.1));

    // Row 3 right: Nr. Spieler
    out.push(renderTriLabel(subSplitX + 3, ySubTop + 6.8, [
      'Nr. Spieler/No jou-',
      'eur/No giocatore'
    ], 5.6, 6.8));

    // Row 4..5 right: Spielstand
    out.push(renderTriLabel(subSplitX + 3, ySubTop + subH + 7.2, [
      'Spielstand',
      'Résultat',
      'Risultato'
    ], 6.1, 7.1));

    // Lower left: Aufschlagrunde
    out.push(renderTriLabel(x + vStripW + 5, turnsY + turnsH / 2 - 7, [
      'Aufschlagrunde',
      'Tours au service',
      'Turni al servizio'
    ], 6.5, 8.2));

    // Lower right: Paired service round numbers (1.|5. .. 4.|8. or 1.|4. .. 3.|6.)
    var pairMidX = subSplitX + (x + w - subSplitX) / 2;
    out.push('<line class="mb-grid" x1="' + pairMidX.toFixed(1) + '" y1="' + turnsY + '" x2="' + pairMidX.toFixed(1) + '" y2="' + (yTopOfRom + bodyH) + '" />');
    for (var r = 0; r < turnRowsCount; r++) {
      var ry = turnsY + r * turnRowH;
      if (r > 0) {
        out.push('<line class="mb-grid" x1="' + subSplitX + '" y1="' + ry.toFixed(1) + '" x2="' + (x + w) + '" y2="' + ry.toFixed(1) + '" />');
      }
      var leftNum = (r + 1) + '.';
      var rightNum = (r + 1 + turnRowsCount) + '.';
      out.push('<text class="mb-fnt" x="' + ((subSplitX + pairMidX) / 2).toFixed(1) + '" y="' + (ry + turnRowH / 2 + 3.8).toFixed(1) + '" font-size="10.5" text-anchor="middle">' + leftNum + '</text>');
      out.push('<text class="mb-fnt" x="' + ((pairMidX + x + w) / 2).toFixed(1) + '" y="' + (ry + turnRowH / 2 + 3.8).toFixed(1) + '" font-size="10.5" text-anchor="middle">' + rightNum + '</text>');
    }

    return out.join('');
  }

  /**
   * Renders the vertical "S A T Z • S E T  N" strip on the left of each set.
   */
  function renderVerticalSetStrip(x, y, w, h, setNumText, subNote) {
    var out = [];
    out.push('<rect class="mb-box" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" />');
    var chars = ['S', 'A', 'T', 'Z', '•', 'S', 'E', 'T'];
    var startY = y + 19;
    var step = (h - 52) / chars.length;
    var cx = x + w / 2;
    for (var i = 0; i < chars.length; i++) {
      var ch = chars[i];
      var fs = ch === '•' ? 11 : 12.5;
      out.push('<text class="mb-fnt" x="' + cx.toFixed(1) + '" y="' + (startY + i * step).toFixed(1) + '" font-size="' + fs + '" font-weight="600" text-anchor="middle">' + ch + '</text>');
    }
    out.push(
      '<text class="mb-fnt" x="' + cx.toFixed(1) + '" y="' + (y + h - (subNote ? 15 : 8)).toFixed(1) +
      '" font-size="' + (setNumText.length > 1 ? '11.5' : '15') + '" font-weight="700" text-anchor="middle">' + esc(setNumText) + '</text>'
    );
    if (subNote) {
      out.push('<text class="mb-fnt" x="' + cx.toFixed(1) + '" y="' + (y + h - 4).toFixed(1) + '" font-size="8.5" font-weight="700" text-anchor="middle">' + esc(subNote) + '</text>');
    }
    return out.join('');
  }

  /**
   * Renders vertical pair of (S) and (R) circles inside a Set Team Header, with ink X on active choice.
   */
  function renderVerticalSRCircles(cx, yTop, teamLetter, firstServeTeam, markActive) {
    var sCy = yTop + 8.2;
    var rCy = yTop + 21.8;
    var r = 5.6;
    var out = [];

    out.push('<circle fill="#ffffff" stroke="#111111" stroke-width="0.65" cx="' + cx.toFixed(1) + '" cy="' + sCy.toFixed(1) + '" r="' + r + '" />');
    out.push('<text class="mb-fnt" x="' + cx.toFixed(1) + '" y="' + (sCy + 2.5).toFixed(1) + '" font-size="7" text-anchor="middle">S</text>');

    out.push('<circle fill="#ffffff" stroke="#111111" stroke-width="0.65" cx="' + cx.toFixed(1) + '" cy="' + rCy.toFixed(1) + '" r="' + r + '" />');
    out.push('<text class="mb-fnt" x="' + cx.toFixed(1) + '" y="' + (rCy + 2.5).toFixed(1) + '" font-size="7" text-anchor="middle">R</text>');

    if (markActive && (firstServeTeam === 'A' || firstServeTeam === 'B')) {
      var targetCy = (firstServeTeam === teamLetter) ? sCy : rCy;
      out.push(
        '<path class="mb-ink-stroke" stroke-width="1.65" d="M' + (cx - 4.5).toFixed(1) + ',' + (targetCy - 4.5).toFixed(1) +
        ' L' + (cx + 4.5).toFixed(1) + ',' + (targetCy + 4.5).toFixed(1) +
        ' M' + (cx + 4.5).toFixed(1) + ',' + (targetCy - 4.5).toFixed(1) +
        ' L' + (cx - 4.5).toFixed(1) + ',' + (targetCy + 4.5).toFixed(1) + '" />'
      );
    }
    return out.join('');
  }

  /**
   * Official Swiss Volley T-bar cancellation on unused running points (Anleitung 3.1e, page 9).
   */
  function renderUnusedPointsCancellation(gridX, gridY, colW, rowH, numCols, rowsPerCol, lastScoredPoint, startCancelAtPoint) {
    var out = [];
    var totalPts = numCols * rowsPerCol;
    var fromPt = startCancelAtPoint !== undefined ? startCancelAtPoint : (lastScoredPoint + 1);
    if (fromPt > totalPts) return '';

    // Pre-switch points 1..K cancelled/transferred in Deciding Set Panel 3
    if (startCancelAtPoint === 1 && lastScoredPoint >= 1) {
      var upto = Math.min(lastScoredPoint, totalPts);
      for (var p = 1; p <= upto; p++) {
        var cIdx = Math.floor((p - 1) / rowsPerCol);
        var rIdx = (p - 1) % rowsPerCol;
        var px = gridX + cIdx * colW;
        var py = gridY + rIdx * rowH;
        out.push(
          '<line class="mb-ink-stroke" stroke-width="1.25" stroke-opacity="0.72" x1="' + (px + 3).toFixed(1) + '" y1="' + (py + rowH - 1.5).toFixed(1) +
          '" x2="' + (px + colW - 3).toFixed(1) + '" y2="' + (py + 1.5).toFixed(1) + '" />'
        );
      }
      return out.join('');
    }

    // End-of-set T-bar below lastScoredPoint + vertical bar through all remaining unused columns
    var firstUnused = Math.max(1, lastScoredPoint + 1);
    var firstCol = Math.floor((firstUnused - 1) / rowsPerCol);
    var firstRow = (firstUnused - 1) % rowsPerCol;

    var barX1 = gridX + firstCol * colW + 1.5;
    var barX2 = gridX + (firstCol + 1) * colW - 1.5;
    var barMidX = (barX1 + barX2) / 2;
    var barY = gridY + firstRow * rowH;
    var colBottomY = gridY + rowsPerCol * rowH - 1.5;

    // Horizontal underline right below last scored point + vertical stem down rest of column ("T-Balken")
    out.push('<line class="mb-ink-stroke" stroke-width="1.65" x1="' + barX1.toFixed(1) + '" y1="' + barY.toFixed(1) + '" x2="' + barX2.toFixed(1) + '" y2="' + barY.toFixed(1) + '" />');
    out.push('<line class="mb-ink-stroke" stroke-width="1.35" x1="' + barMidX.toFixed(1) + '" y1="' + barY.toFixed(1) + '" x2="' + barMidX.toFixed(1) + '" y2="' + colBottomY.toFixed(1) + '" />');

    // Remaining unused columns: top horizontal bar + vertical stem down center
    for (var c = firstCol + 1; c < numCols; c++) {
      var cx1 = gridX + c * colW + 1.5;
      var cx2 = gridX + (c + 1) * colW - 1.5;
      var cMid = (cx1 + cx2) / 2;
      var cyTop = gridY + 1.5;
      out.push('<line class="mb-ink-stroke" stroke-width="1.4" x1="' + cx1.toFixed(1) + '" y1="' + cyTop.toFixed(1) + '" x2="' + cx2.toFixed(1) + '" y2="' + cyTop.toFixed(1) + '" />');
      out.push('<line class="mb-ink-stroke" stroke-width="1.3" x1="' + cMid.toFixed(1) + '" y1="' + cyTop.toFixed(1) + '" x2="' + cMid.toFixed(1) + '" y2="' + colBottomY.toFixed(1) + '" />');
    }

    return out.join('');
  }

  /**
   * Renders a single Team Half inside Sets 1–4 OR a single Panel inside Deciding Set 5 (Panels 1–3).
   * Matches Swiss Volley PDF 1:1:
   *  - Paired Service Rounds (1|5, 2|6, 3|7, 4|8 in Sets 1–4; 1|4, 2|5, 3|6 in Set 5)
   *  - Running Points columns in upper right + "T" Timeout boxes directly underneath Punkte!
   */
  function renderTeamSetPanel(cfg) {
    var state = cfg.state;
    var setObj = cfg.setObj;
    var setIdx = cfg.setIdx;
    var setKeyNum = cfg.setKeyNum;
    var fallbackSetKeyNum = cfg.fallbackSetKeyNum;
    var team = cfg.team; // 'A' or 'B'
    var defaultPrintedLetter = cfg.printedLetter || ''; // 'A'/'B' pre-printed in Sets 1-4, '' in Set 5
    var panelMode = cfg.panelMode || 'regular'; // 'regular' | 'pre' | 'mid' | 'post'
    var sideRole = cfg.sideRole || 'left'; // 'left' (has Beginn), 'right' (has Ende), 'post' (has Pkt beim Seitenwechsel)
    var x = cfg.x;
    var y = cfg.y;
    var w = cfg.w;
    var h = cfg.h;
    var ptsCols = cfg.ptsCols || 4;
    var ptsRows = cfg.ptsRows || 12;
    var ptsTotalW = cfg.ptsTotalW || 67.5;
    var turnRowsCount = cfg.turnRowsCount || 4; // 4 rows x 2 = 8 turns in Sets 1-4; 3 rows x 2 = 6 turns in Set 5
    var interactive = cfg.interactive;
    var printMode = cfg.printMode;
    var hl = cfg.hl;

    var out = [];
    var teamObj = (state.teams && state.teams[team]) || {};
    var setStarted = !!(setObj && (setObj.status === 'live' || setObj.status === 'finished' || setObj.status === 'lineup'));
    var setLiveOrFinished = !!(setObj && (setObj.status === 'live' || setObj.status === 'finished'));
    var firstServe = setObj ? setObj.firstServe : null;
    var switchedAt8 = !!(setObj && setObj.switchedAt8);
    var ptsAtSwitchObj = (setObj && setObj.pointsAtSwitch) || null;
    var teamPtsAtSwitch = (ptsAtSwitchObj && typeof ptsAtSwitchObj[team] === 'number') ? ptsAtSwitchObj[team] : null;

    var hdrH = 30;
    var bodyY = y + hdrH;
    var bodyH = h - hdrH;
    var colsTotalW = w - ptsTotalW;
    var colW = colsTotalW / 6;
    var ptsX = x + colsTotalW;

    // Outer frame for this team panel
    out.push('<rect class="mb-box" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + h.toFixed(1) + '" />');
    out.push('<line class="mb-grid-strong" x1="' + x.toFixed(1) + '" y1="' + bodyY.toFixed(1) + '" x2="' + (x + w).toFixed(1) + '" y2="' + bodyY.toFixed(1) + '" />');
    out.push('<line class="mb-grid-strong" x1="' + ptsX.toFixed(1) + '" y1="' + y.toFixed(1) + '" x2="' + ptsX.toFixed(1) + '" y2="' + (y + h).toFixed(1) + '" />');

    // --- 1. TOP HEADER BAR (h = 30) ---
    var isDecidingPanel = panelMode !== 'regular';
    var decidingAssigned = !!(setStarted || (state.toss && state.toss.decidingInitialLeft));
    var showTeamName = isDecidingPanel
      ? decidingAssigned
      : (setStarted || isMatchStarted(state) || (teamObj.name && teamObj.name !== ('Team ' + team)));
    var teamNameVal = showTeamName ? (teamObj.shortName && w < 300 && (teamObj.name || '').length > 16 ? teamObj.name : (teamObj.name || '')) : '';

    var isCurrentlyServing = !printMode && setObj && setObj.status === 'live' && setObj.servingTeam === team &&
      (panelMode === 'regular' || panelMode === 'mid' || (panelMode === 'pre' && !switchedAt8) || (panelMode === 'post' && switchedAt8));

    if (sideRole === 'left') {
      // [ Beginn/Début/Inizio | Mannschaft/Equipe/Squadra + (A) + (S)/(R) | Punkte ]
      var begW = Math.round(colsTotalW * 0.33);
      var teamBoxX = x + begW;
      var teamBoxW = colsTotalW - begW;
      out.push('<line class="mb-grid" x1="' + teamBoxX.toFixed(1) + '" y1="' + y + '" x2="' + teamBoxX.toFixed(1) + '" y2="' + bodyY + '" />');
      out.push(renderTriLabel(x + 3.5, y + 8, ['Beginn', 'Début', 'Inizio'], 6.0, 7.2));
      out.push('<line class="mb-dotted" x1="' + (x + 28) + '" y1="' + (y + 24) + '" x2="' + (teamBoxX - 3) + '" y2="' + (y + 24) + '" />');
      out.push(renderEditableText({
